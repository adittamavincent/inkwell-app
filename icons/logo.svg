<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1a4560"/>
      <stop offset="1" stop-color="#1f6f78"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nib" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#eef3f0"/>
      <stop offset="0.75" stop-color="#d3ded8"/>
      <stop offset="1" stop-color="#b9c7c0"/>
    </linearGradient>

    <linearGradient id="nibShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa39c" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#8fa39c" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="highlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2530" flood-opacity="0.35"/>
    </filter>

    <!-- Nib body shape, reused for fill + mask -->
    <path id="nibShape" d="M 424 344
             C 452 288, 500 264, 512 264
             C 524 264, 572 288, 600 344
             C 652 424, 636 486, 596 566
             C 562 634, 530 706, 512 788
             C 494 706, 462 634, 428 566
             C 388 486, 372 424, 424 344 Z"/>

    <!-- True cutout mask: white = visible, black = punched through to background -->
    <mask id="nibCutout" maskUnits="userSpaceOnUse">
      <use href="#nibShape" fill="#ffffff"/>
      <!-- breather hole, full cutout -->
      <circle cx="512" cy="392" r="24" fill="#000000"/>
      <!-- slit tapering all the way down to the tip -->
      <path d="M 506 392
               L 518 392
               L 512 800
               Z"
            fill="#000000"/>
    </mask>
  </defs>

  <!-- Rounded-square ink background -->
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#bgGlow)"/>

  <!-- Fountain-pen nib, masked so hole + slit reveal true background beneath -->
  <g filter="url(#softShadow)" mask="url(#nibCutout)">
    <use href="#nibShape" fill="url(#nib)" stroke="#a9b8b1" stroke-width="3"/>
    <use href="#nibShape" fill="url(#nibShade)"/>
  </g>

  <!-- Specular highlight on shoulder -->
  <ellipse cx="470" cy="330" rx="34" ry="20" fill="url(#highlight)" transform="rotate(-35 470 330)"/>

  <!-- Soft overall sheen -->
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#sheen)"/>
</svg>